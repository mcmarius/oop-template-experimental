name: 'Install packages'
description: 'Install required packages'

runs:
  using: "composite"
  steps:
    # Common Linux dependencies
    - name: Install common Linux Dependencies
      if: runner.os == 'Linux'
      uses: ./.github/actions/install-linux-deps

    - name: Install common macOS Dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install vlc

    # FIXME remove this when upgrading to windows-2025
    - name: Install winget
      if: runner.os == 'Windows'
      uses: Cyberboss/install-winget@v1

    - name: Install common Windows Dependencies
      if: runner.os == 'Windows'
      shell: bash
      run: |
        winget install VideoLAN.VLC --source winget

    - name: More Linux Dependencies
      shell: bash
      if: runner.os == 'Linux'
      run: |
        sudo apt-get install ninja-build vlc libvlc-bin xdotool \
          openbox \
          libxkbcommon-x11-0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

        # https://github.com/llvm/llvm-project/issues/78354
        sudo sysctl vm.mmap_rnd_bits=28

    - name: Install valgrind
      shell: bash
      if: runner.os == 'Linux' && matrix.runs_valgrind == true
      run: |
        # sudo apt-get update
        sudo apt-get install --no-install-recommends valgrind
